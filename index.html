<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel Guidsn</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d214a;--blue:#8ba7e8;--bg:#f3f6fd;--fg:#0d214a;--muted:#3b4a6e;--link:#2f55b8;--card:#fff;--soft:rgba(13,33,74,.05);--line:rgba(13,33,74,.16);--ok:#1faa59;--bad:#d93c44}
:root[data-theme=dark]{--bg:#0a1a3b;--fg:#fff;--muted:#c5d0ee;--link:#8ba7e8;--card:#0f2858;--soft:rgba(255,255,255,.06);--line:rgba(139,167,232,.25);--ok:#3ddc84;--bad:#ff6b73}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.55 'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3{margin:0;letter-spacing:-.04em}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
aside{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 18px;gap:6px;padding-top:max(28px,env(safe-area-inset-top))}
.logo{display:flex;align-items:flex-start;gap:2px;padding:0 10px 22px}
.logo svg{height:38px;width:auto;filter:drop-shadow(0 6px 18px rgba(139,167,232,.35))}
.logo .w{fill:#fff}.logo .b{fill:#8ba7e8}.logo small{font-size:10px;font-weight:600;color:var(--blue)}
.nv{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;opacity:.85;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600;position:relative}
.nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv:hover{background:rgba(255,255,255,.07);opacity:1}
.nv.on{color:var(--blue);font-weight:800;opacity:1;background:rgba(139,167,232,.12)}
.nv.on::before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--blue)}
.sp{flex:1}
main{padding:32px clamp(18px,4vw,48px) 80px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.top h1{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.1}
.top .sub{width:100%;color:var(--muted);font-weight:300;margin:-6px 0 0}
.top .sp{flex:1}
.ic{background:none;border:0;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ic:hover{background:var(--soft)}.ic svg{width:22px;height:22px;fill:currentColor}
.menu{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 18px;border-radius:8px;letter-spacing:-.02em;border:2px solid transparent;cursor:pointer;transition:background-color .3s,color .3s,box-shadow .3s}
.btn.p{background:var(--blue);color:var(--navy);box-shadow:0 8px 30px -8px var(--blue)}.btn.p:hover{background:#a9bff0}
.btn.s{background:var(--navy);color:#fff}[data-theme=dark] .btn.s{background:#fff;color:var(--navy)}.btn.s:hover{background:var(--blue);color:var(--navy)}
.btn.o{border-color:var(--blue);color:var(--link);background:none}.btn.o:hover{background:var(--blue);color:var(--navy)}
.btn.d{border-color:var(--bad);color:var(--bad);background:none}.btn.d:hover{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.stat b{display:block;font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--link)}
.stat span{color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.tb input[type=search]{flex:1;min-width:180px}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
input[type=color]{padding:2px;height:40px;width:48px;flex:none;cursor:pointer}
input[type=checkbox]{width:auto}
textarea{min-height:96px;resize:vertical}
label{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-bottom:6px}
.chip{border:1.5px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}[data-theme=dark] .chip.on{background:var(--blue);color:var(--navy);border-color:var(--blue)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pj{padding:0;overflow:hidden;display:flex;flex-direction:column}
.pj .im{aspect-ratio:4/3;background:var(--soft);position:relative;overflow:hidden}
.pj img{width:100%;height:100%;object-fit:cover;display:block}
.pj .im .noimg{display:grid;place-items:center;height:100%;color:var(--muted)}
.pj .bd{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.pj h3{font-size:18px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span,.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.pill{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;border:0}.pill.off{background:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.lst{display:flex;flex-direction:column;gap:12px}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.li .f{display:grid;gap:8px}
dialog{border:0;border-radius:16px;width:min(780px,100% - 24px);max-height:92vh;padding:0;background:var(--bg);color:var(--fg);box-shadow:0 30px 80px -20px rgba(5,12,30,.6)}
dialog::backdrop{background:rgba(5,12,30,.65)}
dialog form{padding:26px;display:grid;gap:16px}
dialog h2{font-size:26px;font-weight:800}
.pal{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.pal>div{display:flex;gap:4px;align-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.gal figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.gal img{width:100%;height:100%;object-fit:cover}
.gal button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--navy);color:#fff;cursor:pointer}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}
pre{background:var(--soft);border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:180px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:99;border:1px solid var(--blue)}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad);border-color:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy);position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;right:-120px;top:-120px;background:radial-gradient(circle,rgba(63,102,255,.7),transparent 68%);opacity:.5}
.login form{position:relative;width:min(400px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(139,167,232,.25);border-radius:16px;padding:32px;display:grid;gap:16px;color:#fff;backdrop-filter:blur(10px)}
.login .logo{padding:0 0 6px}.login h1{font-size:28px;font-weight:800}.login p{margin:0;color:#c5d0ee;font-weight:300}
.login label{color:#c5d0ee}.login input{background:rgba(255,255,255,.08);border-color:rgba(139,167,232,.35);color:#fff}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .3s}aside.open{transform:none}.menu{display:grid}.two,.grid{grid-template-columns:1fr}}

/* ===== animações e brilhos ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--glow:rgba(139,167,232,.55)}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.15)}}
@keyframes sweep{0%,60%{left:-70%}100%{left:130%}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 22px 2px var(--glow)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes ring{to{--a:360deg}}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
aside{overflow:hidden}
aside::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;left:-120px;bottom:-110px;background:radial-gradient(circle,rgba(63,102,255,.55),transparent 68%);opacity:.55;pointer-events:none;animation:drift 12s ease-in-out infinite alternate}
aside>*{position:relative;z-index:1}
.logo{position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 6s ease-in-out infinite;pointer-events:none}
.logo svg{animation:breathe 5s ease-in-out infinite;border-radius:8px}
.nv{transition:background .3s,transform .3s var(--ease),opacity .3s,color .3s}
.nv:hover{transform:translateX(5px)}
.nv svg{transition:transform .35s var(--ease),filter .3s}
.nv:hover svg{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 0 8px var(--glow))}
.nv.on{box-shadow:inset 0 0 0 1px rgba(139,167,232,.25),0 0 24px -6px var(--glow)}
.nv.on::before{box-shadow:0 0 12px 1px var(--blue)}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .3s var(--ease),box-shadow .3s,background-color .3s,color .3s,border-color .3s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none}
.btn:hover::after{left:130%;transition:left .7s ease}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0) scale(.97)}
.btn.p:hover{box-shadow:0 14px 36px -8px var(--blue)}
.btn.s:hover{box-shadow:0 12px 30px -10px var(--blue)}
.btn.d:hover{box-shadow:0 10px 26px -10px var(--bad)}
.btn.p{animation:breathe 4s ease-in-out infinite}
.ic{transition:background .3s,transform .3s var(--ease)}.ic:hover{transform:rotate(12deg) scale(1.08)}
.card{position:relative;transition:transform .4s var(--ease),box-shadow .4s,border-color .4s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(139,167,232,.22),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card:hover{border-color:rgba(139,167,232,.7)}
.stat:hover,.pj:hover{transform:translateY(-6px);box-shadow:0 22px 44px -22px var(--glow),0 0 0 1px rgba(139,167,232,.35)}
.stat b{text-shadow:0 0 28px var(--glow)}
.pj .im::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);pointer-events:none}
.pj:hover .im::after{left:130%;transition:left .8s ease}
.pj img{transition:transform .7s var(--ease)}.pj:hover img{transform:scale(1.07)}
.pill{backdrop-filter:blur(6px);box-shadow:0 0 14px -2px var(--glow)}.pill.off{box-shadow:0 0 14px -2px var(--bad)}
.chip{transition:background .3s,color .3s,transform .3s var(--ease),box-shadow .3s}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px var(--blue);border-color:var(--blue)}
.tags span{transition:background .3s,transform .3s var(--ease)}.tags span:hover{background:rgba(139,167,232,.28);transform:translateY(-1px)}
.dot{box-shadow:0 0 10px 1px currentColor}
input,select,textarea{transition:border-color .25s,box-shadow .25s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(139,167,232,.28),0 0 22px -4px var(--glow)}
.gal figure{transition:transform .3s var(--ease),box-shadow .3s}.gal figure:hover{transform:scale(1.06);box-shadow:0 10px 24px -10px var(--glow)}
.gal button{transition:transform .25s var(--ease),background .25s}.gal button:hover{transform:rotate(90deg) scale(1.15);background:var(--bad)}
.enter .top{animation:up .6s var(--ease) backwards}
.enter .card,.enter .tb,.enter .lst>*{animation:up .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
dialog[open]{animation:pop .4s var(--ease)}dialog[open]::backdrop{animation:fade .3s}
#toast{box-shadow:0 12px 40px -10px var(--glow)}
.login .logo{animation:float 5s ease-in-out infinite}
.login form{animation:pop .8s var(--ease) backwards}
.login form::after{content:"";position:absolute;inset:-1px;border-radius:16px;padding:1px;background:conic-gradient(from var(--a),transparent 0 70%,var(--blue) 90%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ring 6s linear infinite;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

aside{overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
.nv{padding:9px 12px}
.gh{margin:14px 12px 2px;font-size:11px;font-weight:700;color:var(--blue);opacity:.75}
.kan{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;overflow-x:auto;padding:4px 4px 14px;align-items:start}
.kcol{background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.kcol h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.kc{padding:14px;cursor:grab;display:grid;gap:6px}.kc.drag{opacity:.35}.kc.late{border-color:var(--bad)}
.kc span{color:var(--muted);font-size:12px}
.kz{color:var(--muted);text-align:center;font-size:12px;padding:20px 0;margin:0}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--fg)}
.pb{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:12px}
.pb i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),#3f66ff);box-shadow:0 0 12px var(--glow);transition:width .8s var(--ease)}
</style>
</head>

const DB={o(){return new Promise((r,j)=>{const q=indexedDB.open('guidsn-admin',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})},
async get(k){const d=await this.o();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})},
async set(k,v){const d=await this.o();return new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})}};
let S,view='dash',q='',cat='Todos',draft=null,authed=false;
let pubT,busy;
const save=()=>{if(S.gh?.auto&&authed&&S.gh.repo&&S.gh.token){clearTimeout(pubT);pubT=setTimeout(()=>publish(),4000)}return DB.set('state',S).catch(()=>toast('Não foi possível salvar. Verifique o espaço do navegador.',1))};
const b64=s=>{const by=new TextEncoder().encode(s);let o='';for(let i=0;i<by.length;i+=32768)o+=String.fromCharCode.apply(null,by.subarray(i,i+32768));return btoa(o)};
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)+s.length.toString(36)};
const ghx=(path,method,body)=>fetch(`https://api.github.com/repos/${S.gh.repo}/contents/${path}`+(method==='GET'?`?ref=${encodeURIComponent(S.gh.branch||'main')}&t=${Date.now()}`:''),{method,cache:'no-store',headers:{Authorization:'Bearer '+S.gh.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
async function put(path,content,msg,n=0){let sha;const r=await ghx(path,'GET');if(r.ok)sha=(await r.json()).sha;else if(r.status===401)throw Error('Token inválido ou expirado.');else if(r.status!==404)throw Error('Sem acesso ao repositório ('+r.status+').');
 const w=await ghx(path,'PUT',{message:msg,content,branch:S.gh.branch||'main',sha});
 if(w.status===409&&n<5){await new Promise(r=>setTimeout(r,1000*(n+1)));return put(path,content,msg,n+1)}
 if(!w.ok)throw Error(w.status===404?'Repositório ou branch não encontrado. Confira os dados.':w.status===403?'O token precisa da permissão Contents: Read and write.':'Falha ao publicar ('+w.status+').')}
const setSt=m=>{const e=$('#gst');if(e)e.textContent=m};
async function publish(manual){const g=S.gh;if(!g.repo||!g.token){if(manual)toast('Preencha o repositório e o token.',1);return}if(busy)return;busy=1;setSt('Publicando…');
 try{S.up=S.up||{};const up=async(id,d,n)=>{if(!d||!d.startsWith('data:'))return d;const p=`uploads/${id}-${n}-${hs(d)}.webp`;if(!S.up[p]){await put(p,d.split(',')[1],'Painel: imagem de '+id);S.up[p]=1}return p};
 const P=[];for(const p of S.projects.filter(x=>x.on!==false)){const {on,cv0,...o}=p;o.url=o.url||'';setSt('Enviando imagens de '+p.name+'…');
  if(cv0)delete o.cover;else o.cover=await up(p.id,p.cover,'c');
  if(p.imgs.length){o.imgs=[];for(let i=0;i<p.imgs.length;i++)o.imgs.push(await up(p.id,p.imgs[i],i))}else if(cv0)delete o.imgs;else o.imgs=[];P.push(o)}
 const data={updated:new Date().toISOString(),WA_NUMBER:S.cfg.wa,WA_MSG:S.cfg.msg,P,SERVICES:S.services.map(s=>[s.t,s.d]),FAQ:S.faq.map(f=>[f.q,f.a]),PLANS:(S.plans||[]).map(p=>({name:p.name,price:p.price,items:(p.items||'').split('\n').filter(Boolean),hl:!!p.hl}))};
 setSt('Publicando dados…');await put('dados-site.json',b64(JSON.stringify(data,null,1)),'Painel: atualiza dados do site');
 g.last=new Date().toISOString();await DB.set('state',S);setSt('Publicado em '+new Date(g.last).toLocaleString('pt-BR')+'. O site atualiza em alguns minutos.');if(manual)toast('Publicado no GitHub.')}
 catch(e){setSt('Não publicado: '+e.message);toast(e.message,1)}finally{busy=0}}
function autoCard(){const g=S.gh,f=(k,l,t,ph)=>`<div><label for="g-${k}">${l}</label><input id="g-${k}" data-g="${k}" type="${t}" value="${esc(g[k])}" placeholder="${ph}" autocomplete="off"></div>`;
return `<div class="card"><h3 style="margin-bottom:6px">Atualização automática do site</h3><p style="color:var(--muted);margin:0 0 14px">O painel grava os dados e as imagens no seu repositório do GitHub. A hospedagem (GitHub Pages, Vercel ou Netlify) republica o site em poucos minutos.</p><div class="grid">${f('repo','Repositório (usuário/nome)','text','seu-usuario/seu-site')}${f('branch','Branch publicada','text','main')}${f('token','Token de acesso do GitHub','password','github_pat_…')}<label class="row" style="align-self:end;margin:0 0 10px"><input type="checkbox" data-g="auto" ${g.auto?'checked':''}> Publicar sozinho a cada alteração</label></div><details style="margin:12px 0;color:var(--muted)"><summary style="cursor:pointer;font-weight:600">Como criar o token</summary><ol><li>No GitHub, abra Settings, Developer settings, Personal access tokens e Fine-grained tokens.</li><li>Clique em Generate new token e, em Repository access, escolha só o repositório do seu site.</li><li>Em Permissions, defina Contents como Read and write.</li><li>Copie o token e cole aqui.</li></ol></details><div class="row" style="flex-wrap:wrap"><button class="btn p" data-act="pub">Publicar agora</button><span id="gst" role="status" style="color:var(--muted)">${g.last?'Última publicação: '+new Date(g.last).toLocaleString('pt-BR'):'Ainda não publicado.'}</span></div></div>`}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2800)}
const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gd:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('gd:'+s)))}};
const img=(f,m,qa)=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/webp',qa))};i.onerror=no;i.src=u});

function mkpdf(){const L=qlines();if(!L.length)return toast('Adicione ao menos um item.',1);const c=S.clients.find(x=>x.id===Q.client),n=S.quotes.length+1,tot=L.reduce((a,x)=>a+x.v,0),w=window.open('','_blank');if(!w)return toast('Libere os pop-ups para gerar o PDF.',1);
 w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Orçamento ${n} - ${esc(c?c.name:'')}</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;800&display=swap" rel="stylesheet"><style>@page{margin:16mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font:14px/1.6 Sora,system-ui,sans-serif;color:#0d214a;margin:0}.h{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #8ba7e8;padding-bottom:16px}svg{height:46px;width:auto}.w{fill:#0d214a}.b{fill:#8ba7e8}h1{margin:28px 0 4px;font-size:30px;letter-spacing:-.04em}table{width:100%;border-collapse:collapse;margin:22px 0}td,th{padding:11px;border-bottom:1px solid #d5dcf0;text-align:left}th{background:#f3f6fd}.r{text-align:right}.t{font-size:24px;font-weight:800;text-align:right;color:#2f55b8}.o{white-space:pre-wrap;color:#3b4a6e}.f{margin-top:40px;color:#3b4a6e;font-size:12px}</style><div class="h">${$('#logo-t').innerHTML}<div style="text-align:right">Orçamento nº ${String(n).padStart(3,'0')}<br>${fd(today())}</div></div><h1>Proposta para ${esc(c?c.name:'')}</h1><p>Validade: ${esc(Q.days)} dias.</p><table><tr><th>Descrição</th><th class="r">Valor</th></tr>${L.map(l=>`<tr><td>${esc(l.d)}</td><td class="r">${R$(l.v)}</td></tr>`).join('')}</table><div class="t">Total: ${R$(tot)}</div>${Q.obs?`<h3>Observações</h3><p class="o">${esc(Q.obs)}</p>`:''}<p class="f">${esc(S.cfg.nome)} · WhatsApp ${esc(S.cfg.wa)}</p>`);
 w.document.close();setTimeout(()=>w.print(),700);S.quotes.push({n,date:today(),client:c?c.name:'',total:tot});sv2()}
const fill=(m,cid)=>{const c=S.clients.find(x=>x.id===cid),t=S.tasks.filter(x=>x.client===cid).slice(-1)[0];return m.b.replace(/\{nome\}/g,c?c.name.split(' ')[0]:'').replace(/\{projeto\}/g,t?t.t:'').replace(/\{seunome\}/g,S.cfg.nome)};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act^="g:"]');if(!b)return;e.preventDefault();const a=b.dataset.act.slice(2),k=b.dataset.k,L=k&&S[GK[k]],id=b.dataset.id;
 if(a==='new')gopen(k,{...SP[k].def,...(b.dataset.col?{col:+b.dataset.col}:{})});
 else if(a==='edit')gopen(k,JSON.parse(JSON.stringify(L.find(x=>x.id===id))));
 else if(a==='del'){if(confirm('Excluir este item?')){L.splice(L.findIndex(x=>x.id===id),1);sv2();render();toast('Excluído.')}}
 else if(a==='mv'){const t=S.tasks.find(x=>x.id===id),d=+b.dataset.d;t.col=d===4?4:Math.max(0,Math.min(4,t.col+d));sv2();render()}
 else if(a==='paid'){const x=S.fin.find(y=>y.id===id);x.paid=x.total;sv2();render();toast('Quitado.')}
 else if(a==='wa'||a==='cp'){const m=S.msgs.find(x=>x.id===id),cid=$('#ms-'+id).value,tx=fill(m,cid);if(a==='cp'){try{await navigator.clipboard.writeText(tx);toast('Mensagem copiada.')}catch(_){toast('Não foi possível copiar.',1)}}else{const c=S.clients.find(x=>x.id===cid);window.open('https://wa.me/'+(c&&c.wa?c.wa.replace(/\D/g,''):'')+'?text='+encodeURIComponent(tx),'_blank','noopener')}}
 else if(a==='pdf')mkpdf();
 else if(a==='save'){const f=$('#gf');if(!f.reportValidity())return;const o={...GD.o};SP[GD.k].f.forEach(([key,,t])=>{const el=f.elements[key];let v=t==='chk'?el.checked:el.value;if(t==='number')v=+v||0;if(key==='col')v=+v;if(key==='files')v=v.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const [n,...u]=s.split('|');return u.length?{n:n.trim(),u:u.join('|').trim()}:{n:s,u:s}});o[key]=v});
  const A=S[GK[GD.k]],i=A.findIndex(x=>x.id===o.id);if(i<0){o.id=uid();A.push(o)}else A[i]=o;sv2();$('#dlg').close();render();toast('Salvo.')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.q){Q[t.dataset.q]=t.value;render()}else if(t.dataset.qp){Q.sel=t.checked?[...Q.sel,t.dataset.qp]:Q.sel.filter(x=>x!==t.dataset.qp);render()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kc');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')}});
document.addEventListener('dragend',e=>e.target.classList&&e.target.classList.remove('drag'));
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.kcol'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.kcol');if(!c)return;e.preventDefault();const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.col=+c.dataset.col;sv2();render()}});
(async()=>{try{S=await DB.get('state')}catch(_){}
 if(!S){S=structuredClone(SEED);try{await save()}catch(_){}}
 S.gh=S.gh||{repo:'',branch:'main',token:'',auto:false};S.up=S.up||{};['tasks','clients','fin','plans','quotes'].forEach(k=>S[k]=S[k]||[]);S.msgs=S.msgs||structuredClone(DEF_MSGS);S.projects.forEach(p=>{const s=SEED.projects.find(x=>x.id===p.id);if(s&&p.cv0===undefined&&p.cover===s.cover)p.cv0=true});
 document.documentElement.dataset.theme=S.theme||'light';
 try{authed=!!S.pass&&sessionStorage.getItem('gd')==='1'}catch(_){}
 render()})();
